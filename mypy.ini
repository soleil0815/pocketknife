# Typprüfung (mypy) – läuft in der Prüfung auf GitHub (test.yml). Der Code ist kaum annotiert; check_untyped_defs prüft
# trotzdem die Rümpfe aller Funktionen (falsche Attribute, None-Zugriffe, falsche Argumente …).
[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
show_error_codes = True
