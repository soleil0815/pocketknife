# Type check (mypy) - runs in the check on GitHub (test.yml). The code is hardly annotated; check_untyped_defs still
# checks the bodies of all functions (wrong attributes, None accesses, wrong arguments ...).
[mypy]
python_version = 3.12
ignore_missing_imports = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
show_error_codes = True
disable_error_code = import-untyped
