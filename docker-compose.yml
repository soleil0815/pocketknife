# POCKET KNIFE - all adjustable values are in the .env
# This file does NOT need to be edited when changing versions. Install: put it next to the .env, docker compose up -d.
# Update: a container manager (Dockhand, Watchtower …) or "docker compose pull && docker compose up -d" or "sudo sh update.sh".
# Before starting a new version, POCKET KNIFE backs up its database itself.
# PK_COMPOSE_VERSION below: the state of this file – if the program needs a newer one, it says so (sudo sh update.sh
# puts the new one in place and keeps the old one as docker-compose.yml.alt). Own changes: docker-compose.override.yml.
name: pocketknife

services:
  pocketknife:
    # Ready-made image from the GitHub Container Registry (amd64/arm64). To stay on a version:
    # PK_IMAGE=ghcr.io/soleil0815/pocketknife:2.33.0 in the .env (sudo sh update.sh 2.33.0 sets it).
    image: ${PK_IMAGE:-ghcr.io/soleil0815/pocketknife:latest}
    container_name: pocketknife
    restart: unless-stopped
    # Hardening (since 2.14): the service runs as user "pocketknife" (UID 10001) without special privileges.
    # At start it hands /data and /backup over to this user once as root (hence CHOWN/DAC_OVERRIDE)
    # and then drops the privileges for good (SETUID/SETGID). After that the process has no capabilities.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    # Program files read-only; writes go only to /data, /backup and the small /tmp
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    # No custom sysctls: Docker (20.10+) already allows ports below 1024 and ping without root in the container.
    # A fixed net.ipv4.ping_group_range prevents the start depending on the Docker configuration (2.14).
    env_file: .env
    environment:
      TZ: ${PK_TIMEZONE:-Europe/Berlin}
      PK_COMPOSE_VERSION: "2"
    ports:
      - "${PK_PORT:-8443}:${PK_PORT:-8443}"
    volumes:
      # Database, logs, certificate, winget index (path from the .env)
      - ${PK_DATA_PATH:-./data}:/data
      # Optional repository folder (default: empty folder)
      - ${PK_REPO_MOUNT:-./repo}:/repo:ro
      # Automatic backups (default: folder next to the data directory, e.g. /opt/pocketknife/data-backup)
      - ${PK_BACKUP_PATH:-${PK_DATA_PATH:-./data}-backup}:/backup
    # DNS servers of the domain, so computer names can be resolved. PK_DNS_2 is optional: empty is dropped by Compose
    # (never the same address twice – older Compose versions, e.g. on a NAS, reject duplicate entries)
    dns:
      - ${PK_DNS_1:?set PK_DNS_1 in the .env (DNS server of the domain)}
      - ${PK_DNS_2:-}
    dns_search:
      - ${PK_DNS_SEARCH:-${PK_DOMAIN}}
    depends_on:
      - guacd

  # Apache Guacamole – provides RDP/VNC for the remote sessions in the browser.
  # Reachable internally only (no published port); connects directly to the clients (3389/5900).
  guacd:
    # Since 2.33: the official guacd, checked and published by POCKET KNIFE under its own name (updated every week like
    # POCKET KNIFE itself) – this file no longer changes for a guacd update. Same version: PK_GUACD_IMAGE=…:2.33.0
    image: ${PK_GUACD_IMAGE:-ghcr.io/soleil0815/pocketknife-guacd:latest}
    container_name: pocketknife-guacd
    restart: unless-stopped
    # guacd already runs as its own user in the official image; additionally no privilege escalation
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TZ: ${PK_TIMEZONE:-Europe/Berlin}
    dns:
      - ${PK_DNS_1:?set PK_DNS_1 in the .env (DNS server of the domain)}
      - ${PK_DNS_2:-}
    dns_search:
      - ${PK_DNS_SEARCH:-${PK_DOMAIN}}
