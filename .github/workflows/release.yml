# POCKET KNIFE – Release: Image für amd64 und arm64 bauen, Selbsttest, in die GitHub Container Registry (ghcr.io)
# laden und ein Release mit der Programm-ZIP anlegen.
#
# Auslösen: Tag „v<VERSION>“ pushen (muss zur Datei VERSION passen), z. B.
#     git tag v2.27.1 && git push origin v2.27.1
# oder von Hand unter Actions → Release → Run workflow (baut die Version aus VERSION).
#
# Die Programm-ZIP liegt zusätzlich IM Image (/opt/pocketknife/dist) – update.sh --pull nimmt sie von dort und
# braucht so nur die Docker-Anmeldung an der Registry, keinen weiteren Zugang zu GitHub.
# Alle Actions sind auf einen Commit festgelegt (wie die übrigen Bausteine, siehe tools/pin-versions.sh).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}       # nichts vorab – der Job bekommt nur, was er braucht

concurrency:
  group: release        # nie zwei Releases gleichzeitig (Tag und „Run workflow“ derselben Version)
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write     # Release anlegen
      packages: write     # Image nach ghcr.io
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false   # Token nicht im Arbeitsordner liegen lassen (Bau, Selbsttest)

      - name: Version prüfen
        id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          case "$VER" in ''|*[!0-9.]*) echo "::error::Ungültige VERSION: '$VER'"; exit 1 ;; esac
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VERSION $VER (erwartet v$VER)"; exit 1
          fi
          grep -q "^## pocketknife-$VER " CHANGELOG.md || { echo "::error::CHANGELOG.md hat keinen Eintrag für $VER"; exit 1; }
          python3 -c "import json,sys; v=sys.argv[1]; d=json.load(open('app/news.json')); sys.exit(0 if any(x['version']==v for x in d['versions']) else 1)" "$VER" \
            || { echo "::error::app/news.json hat keine Neuigkeiten für $VER (Seitenleiste „Neu“)"; exit 1; }
          # Nur Stände, die auf dem Hauptzweig liegen (kein Release aus einem Nebenzweig oder fremden Tag)
          DEF=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          ST=$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEF...$GITHUB_SHA" --jq .status)
          case "$ST" in identical|behind) ;; *) echo "::error::$GITHUB_SHA liegt nicht auf $DEF ($ST)"; exit 1 ;; esac
          # Veröffentlichte Versionen werden nie überschrieben – für Änderungen VERSION erhöhen
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VER gibt es schon – bitte VERSION erhöhen"; exit 1
          fi
          # „latest“ nur, wenn diese Version die höchste ist (ein nachgereichtes älteres Release zieht latest nicht zurück)
          LATEST=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null | sed 's/^v//' || true)
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMG:$VER"
          ISLATEST=false
          if [ -z "$LATEST" ] || [ "$(printf '%s\n%s\n' "$LATEST" "$VER" | sort -V | tail -n 1)" = "$VER" ]; then TAGS="$TAGS,$IMG:latest"; ISLATEST=true; fi
          echo "latest=$ISLATEST" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Programm-ZIP (wie bisher, Ordner pocketknife/)
        run: |
          VER=${{ steps.v.outputs.version }}
          mkdir -p dist
          git archive --format=zip --prefix=pocketknife/ -o "dist/pocketknife-$VER.zip" HEAD
          (cd dist && sha256sum "pocketknife-$VER.zip" > "pocketknife-$VER.zip.sha256")
          cat "dist/pocketknife-$VER.zip.sha256"

      - name: QEMU (arm64 auf amd64)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm64

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Testbau amd64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pocketknife-test:amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Selbsttest amd64
        run: |
          # Fehlgeschlagene Tests als Hinweis direkt am Lauf zeigen (Annotation)
          if ! docker run --rm --platform linux/amd64 -e PK_SELFTEST_TRACE=1 pocketknife-test:amd64 python3 tools/selftest.py > selftest.txt 2>&1; then
            tail -n 120 selftest.txt
            msg=$( (grep -A14 "✗" selftest.txt || tail -n 60 selftest.txt) | head -n 150 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Selbsttest amd64::${msg:-Selbsttest fehlgeschlagen (siehe Log)}"
            exit 1
          fi
          tail -n 1 selftest.txt

      - name: Testbau arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: pocketknife-test:arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Selbsttest arm64 (emuliert)
        run: |
          # Fehlgeschlagene Tests als Hinweis direkt am Lauf zeigen (Annotation)
          if ! docker run --rm --platform linux/arm64 -e PK_SELFTEST_TRACE=1 pocketknife-test:arm64 python3 tools/selftest.py > selftest.txt 2>&1; then
            tail -n 120 selftest.txt
            msg=$( (grep -A14 "✗" selftest.txt || tail -n 60 selftest.txt) | head -n 150 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Selbsttest arm64 (emuliert)::${msg:-Selbsttest fehlgeschlagen (siehe Log)}"
            exit 1
          fi
          tail -n 1 selftest.txt

      - name: Anmelden an ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen und hochladen (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.title=POCKET KNIFE
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: |
            type=gha,scope=amd64
            type=gha,scope=arm64

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=${{ steps.v.outputs.version }}
          echo "${{ steps.v.outputs.image }}@${{ steps.push.outputs.digest }}" > "dist/pocketknife-$VER.image"
          # Abschnitt dieser Version aus dem CHANGELOG als Beschreibung
          awk -v v="## pocketknife-$VER " 'index($0, v) == 1 { on = 1; next } /^## pocketknife-/ { on = 0 } on' CHANGELOG.md > notes.md
          {
            echo ""
            echo "**Update:** \`sh update.sh --pull\` (Image aus der Registry) oder \`sh update.sh pocketknife-$VER.zip\`."
            echo "**Image:** \`$(cat "dist/pocketknife-$VER.image")\` (linux/amd64, linux/arm64)"
          } >> notes.md
          gh release create "v$VER" dist/* --title "POCKET KNIFE $VER" --notes-file notes.md --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY" --latest=${{ steps.v.outputs.latest }}
