# POCKET KNIFE – bei jedem Push und Pull Request: Image bauen (amd64) und Selbsttest darin laufen lassen.
# Es wird nichts veröffentlicht (dafür: release.yml mit einem Tag v<VERSION>).
name: Test

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Bauen (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pocketknife-test:amd64
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

      - name: Selbsttest im Image
        run: |
          # Fehlgeschlagene Tests als Hinweis direkt am Lauf zeigen (Annotation)
          if ! docker run --rm -e PK_SELFTEST_TRACE=1 pocketknife-test:amd64 python3 tools/selftest.py > selftest.txt 2>&1; then
            tail -n 120 selftest.txt
            msg=$( (grep -A14 "✗" selftest.txt || tail -n 60 selftest.txt) | head -n 150 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Selbsttest im Image::${msg:-Selbsttest fehlgeschlagen (siehe Log)}"
            exit 1
          fi
          tail -n 1 selftest.txt

      - name: Selbsttest auf dem Checkout (Workflows, Compose, update.sh)
        run: |
          # 2.37: im Image fehlen Workflows, Dockerfile, docker-compose.yml und update.sh – die Prüfungen dazu werden dort
          # übersprungen. Hier laufen sie mit dem Checkout (Programm und Abhängigkeiten aus dem gebauten Image).
          if ! docker run --rm -e PK_SELFTEST_TRACE=1 -e PK_DATA_DIR=/tmp/pk-data -v "$PWD:/src:ro" -w /src --entrypoint python3 \
               pocketknife-test:amd64 -I tools/selftest.py > selftest-repo.txt 2>&1; then
            tail -n 120 selftest-repo.txt
            msg=$( (grep -A14 "✗" selftest-repo.txt || tail -n 60 selftest-repo.txt) | head -n 150 | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g')
            echo "::error title=Selbsttest auf dem Checkout::${msg:-Selbsttest fehlgeschlagen (siehe Log)}"
            exit 1
          fi
          grep -c "übersprungen" selftest-repo.txt || true
          tail -n 1 selftest-repo.txt

      - name: Schwachstellen prüfen (Trivy)
        env:
          PK_TRIVY_REPORT: trivy.md
        run: |
          rc=0; sh tools/trivy-scan.sh pocketknife-test:amd64 || rc=$?
          if [ -f trivy.md ]; then cat trivy.md >> "$GITHUB_STEP_SUMMARY"; fi
          [ "$rc" = 1 ] && echo "::error title=Trivy::Schwachstellen mit verfügbarer Korrektur – ein Release würde abgelehnt. Abhilfe: Actions → Versionen aktualisieren."
          exit "$rc"
