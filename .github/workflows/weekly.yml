# POCKET KNIFE – security update on patch day (once a month, the second Tuesday – like Microsoft's Patch Tuesday, the
# same day in all programs; the schedule starts every Tuesday, tools/patchday.sh only lets the second one through): bring the base image, Debian and Python packages and guacd to the
# latest state (tools/pin-versions.sh --update), rebuild without cache, self-test, vulnerability scan
# (Trivy) - and ONLY if everything passes: security update number (e.g. 2.29.7 → 2.29.7-s1 - same program, only new packages), entry in CHANGELOG and
# news - saved on main (normal push, never force) and published straight away, like in all other programs of the
# owner: this workflow then starts the release workflow, which builds amd64 and arm64, tests and scans both once more
# and publishes under <version> and :latest - together with guacd as …/pocketknife-guacd. (From 2.37 until patch day
# 2026-12 the update came as a pull request; the owner decided that security updates publish themselves on patch day
# in all programs - program changes still only come via pull request and are published by hand.)
#
# If nothing has changed, nothing happens. If a step fails, NOTHING is published - GitHub sends
# a mail to the owner. By hand (any day, e.g. for an urgent fix): Actions → Security update (patch day) → Run workflow.
# Note: GitHub pauses scheduled runs after 60 days without a change in the repository. If main changes while the
# update runs, the push is refused and nothing is published (start it again by hand).
name: Security update (patch day)

on:
  schedule:
    - cron: "23 3 * * 2"   # Tuesdays 03:23 UTC – security update, only on patch day (2nd Tuesday, job patchday)
    - cron: "23 3 * * 1"   # Mondays 03:23 UTC – base check only (job unterbau)
  workflow_dispatch:

permissions: {}

concurrency:
  # 2.32.5: own group - if it shared "release" with the release workflow, GitHub could discard a waiting release
  # (e.g. a tag) in favour of the one started by the security update (only one waiting run per group)
  group: weekly-security
  cancel-in-progress: false

jobs:
  patchday:
    # Scheduled: only the Tuesday run on patch day goes on (a cron line cannot say "second Tuesday"); by hand: any day.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/patchday.sh
          sparse-checkout-cone-mode: false

      - name: Patch day?
        id: check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != schedule ] || { [ "$SCHEDULE" = "23 3 * * 2" ] && sh tools/patchday.sh; }; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
            [ "$SCHEDULE" != "23 3 * * 2" ] || echo "::notice title=Security update::Not patch day – the security update runs on the second Tuesday of the month."
          fi

  stand:
    needs: patchday
    if: needs.patchday.outputs.due == 'true'
    # 2.32.5: Only put a "-sN" on a published state. If main holds a merged but not yet published program version,
    # it would otherwise have appeared as a security update ("nothing changed in the program").
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      released: ${{ steps.chk.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Is the version on main published?
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Security update::Version $VER on main is not published yet – no security update until it is published."
            echo "Version **$VER** on main is not published yet – no security update this time." >> "$GITHUB_STEP_SUMMARY"
          fi

  update:
    needs: stand
    if: needs.stand.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write        # save version, CHANGELOG, news and the new pins on main (normal push, never force)
      actions: write         # start the release workflow (only release.yml publishes images)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false   # no Git credentials in the working folder (build, tests) - only when saving

      - name: Remember the previous state
        run: git worktree add -q "$RUNNER_TEMP/vorher" HEAD

      - name: Update versions, build without cache, self-test
        run: |
          # Show errors directly on the run (annotation) - the logs are otherwise only readable in the web interface
          if ! sh tools/pin-versions.sh --update > pin.log 2>&1; then
            tail -n 150 pin.log
            # keep it short (annotations are cut off after ~4 KB): error lines and the end, each line shortened
            { grep -nE 'ERROR|Error|error:|Traceback|✗|failed|FAILED|not found|No such|conflict' pin.log | tail -n 15; echo ...; tail -n 12 pin.log; } \
              | cut -c1-220 > pin.err
            msg=$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' pin.err)
            echo "::error title=Update versions::${msg:-failed (see log)}"
            exit 1
          fi
          tail -n 40 pin.log

      - name: Anything changed?
        id: diff
        run: |
          if git diff --quiet -- Dockerfile requirements.lock requirements.caps build-requirements.txt docker/apt-build.txt docker/apt-runtime.txt docker/guacd.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Everything is already up to date – no new version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check vulnerabilities (Trivy)
        if: steps.diff.outputs.changed == 'true'
        env:
          PK_TRIVY_REPORT: trivy.md
        run: |
          rc=0; sh tools/trivy-scan.sh pocketknife:local || rc=$?
          if [ -f trivy.md ]; then cat trivy.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" != 0 ]; then
            echo "::error title=Security update::Trivy has findings (or could not scan) – nothing will be published."
          fi
          exit "$rc"

      - name: Check guacd (Trivy, notice only)
        if: steps.diff.outputs.changed == 'true'
        env:
          PK_TRIVY_REPORT: trivy-guacd.md
        run: |
          # guacd is built by the Guacamole project - POCKET KNIFE always takes its latest version but cannot fix it
          # itself; findings therefore do not block the update, they appear in the summary
          G=$(sed -n 's/^\(guacamole\/guacd:[^ ]*\)$/\1/p' docker/guacd.txt | head -n 1)
          rc=0; sh tools/trivy-scan.sh "$G" || rc=$?
          if [ -f trivy-guacd.md ]; then cat trivy-guacd.md >> "$GITHUB_STEP_SUMMARY"; fi
          [ "$rc" = 0 ] || echo "::warning title=guacd::$G has findings (or could not be scanned) – can only be fixed by the Guacamole project."

      - name: Record the new version on main and publish
        id: ver
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          VER=$(python3 tools/security-release.py "$RUNNER_TEMP/vorher")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          git add -A Dockerfile requirements.lock requirements.caps build-requirements.txt docker/apt-build.txt docker/apt-runtime.txt \
            docker/guacd.txt VERSION CHANGELOG.md app/news.json README.md README.en.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "pocketknife $VER: security update (base image and packages)"
          # Normal push (never forced): if main changed in the meantime, GitHub refuses it and nothing is published
          if ! git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BASE"; then
            echo "::error title=Security update::main changed during the update – nothing published. Start Actions → Security update (patch day) → Run workflow again."
            exit 1
          fi
          # Only release.yml publishes: it checks VERSION, CHANGELOG and news again, builds amd64/arm64, self-test and Trivy
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$BASE"
          {
            echo "Security update **$VER** saved on $BASE – the release workflow publishes it now (Actions → Release)."
            echo
            [ -f trivy.md ] && cat trivy.md
          } >> "$GITHUB_STEP_SUMMARY"

  unterbau:
    # Own job: reports in good time when the Python series or Debian version stops receiving updates (red from 180
    # days before → mail) - never blocks the security updates. Scheduled: Mondays (weekly), also by hand.
    if: github.event_name != 'schedule' || github.event.schedule == '23 3 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: How much longer will the base platform get updates?
        run: |
          rc=0; python3 tools/unterbau-check.py > unterbau.txt || rc=$?
          cat unterbau.txt
          sed 's/^::[a-z]* title=[^:]*:://' unterbau.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
