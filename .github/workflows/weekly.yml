# POCKET KNIFE – wöchentliches Sicherheitsupdate (montags): Basis-Image, Debian- und Python-Pakete und guacd auf den
# neuesten Stand bringen (tools/pin-versions.sh --update), ohne Cache neu bauen, Selbsttest, Schwachstellen-Prüfung
# (Trivy) – und NUR wenn alles bestanden ist: Sicherheitsupdate-Nummer (z. B. 2.29.7 → 2.29.7-s1 – gleiches Programm, nur neue Pakete), Eintrag in CHANGELOG und
# Neuigkeiten, Commit auf main und Release starten. Der Release-Workflow baut dann amd64 und arm64, testet und prüft
# beide noch einmal und veröffentlicht unter <Version> und :latest – zusammen mit guacd als …/pocketknife-guacd (Container-Verwaltung wie Dockhand oder sudo sh update.sh).
#
# Hat sich nichts geändert, passiert nichts. Schlägt ein Schritt fehl, wird NICHTS veröffentlicht – GitHub schickt
# eine Mail an den Besitzer. Von Hand: Actions → Wöchentliches Sicherheitsupdate → Run workflow.
# Hinweis: GitHub pausiert geplante Läufe nach 60 Tagen ohne Änderung im Repository – durch die wöchentlichen
# Commits passiert das hier normalerweise nicht.
name: Wöchentliches Sicherheitsupdate

on:
  schedule:
    - cron: "23 3 * * 1"   # montags 03:23 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  # 2.32.5: eigene Gruppe – teilte sie sich „release“ mit dem Release-Workflow, könnte GitHub einen wartenden Release
  # (z. B. Tag) zugunsten des vom wöchentlichen Lauf gestarteten verwerfen (je Gruppe nur ein wartender Lauf)
  group: weekly-security
  cancel-in-progress: false

jobs:
  stand:
    # 2.32.5: Nur auf einen veröffentlichten Stand ein „-sN“ setzen. Liegt auf main eine gemergte, aber noch nicht
    # veröffentlichte Programmversion, wäre sie sonst als Sicherheitsupdate („nichts am Programm geändert“) erschienen.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      released: ${{ steps.chk.outputs.released }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Ist die Version auf main veröffentlicht?
        id: chk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(tr -d ' \r\n' < VERSION)
          if gh release view "v$VER" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Wöchentliches Sicherheitsupdate::Version $VER auf main ist noch nicht veröffentlicht – kein Sicherheitsupdate, bis sie veröffentlicht ist."
            echo "Version **$VER** auf main ist noch nicht veröffentlicht – diesmal kein Sicherheitsupdate." >> "$GITHUB_STEP_SUMMARY"
          fi

  update:
    needs: stand
    if: needs.stand.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write     # Commit auf main
      actions: write      # Release-Workflow starten
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false   # keine Git-Anmeldedaten im Arbeitsordner (Bau, Tests) – nur beim Speichern

      - name: Bisherigen Stand merken
        run: git worktree add -q "$RUNNER_TEMP/vorher" HEAD

      - name: Versionen aktualisieren, ohne Cache bauen, Selbsttest
        run: |
          # Fehler direkt am Lauf zeigen (Annotation) – die Protokolle sind sonst nur in der Weboberfläche lesbar
          if ! sh tools/pin-versions.sh --update > pin.log 2>&1; then
            tail -n 150 pin.log
            # kurz halten (Annotationen werden nach ~4 KB abgeschnitten): Fehlerzeilen und das Ende, je Zeile gekürzt
            { grep -nE 'ERROR|Error|error:|Traceback|✗|failed|FAILED|not found|No such|conflict' pin.log | tail -n 15; echo ...; tail -n 12 pin.log; } \
              | cut -c1-220 > pin.err
            msg=$(sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' pin.err)
            echo "::error title=Versionen aktualisieren::${msg:-fehlgeschlagen (siehe Log)}"
            exit 1
          fi
          tail -n 40 pin.log

      - name: Etwas geändert?
        id: diff
        run: |
          if git diff --quiet -- Dockerfile requirements.lock requirements.caps build-requirements.txt docker/apt-build.txt docker/apt-runtime.txt docker/guacd.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Alles ist schon aktuell – keine neue Version." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Schwachstellen prüfen (Trivy)
        if: steps.diff.outputs.changed == 'true'
        env:
          PK_TRIVY_REPORT: trivy.md
        run: |
          rc=0; sh tools/trivy-scan.sh pocketknife:local || rc=$?
          if [ -f trivy.md ]; then cat trivy.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" != 0 ]; then
            echo "::error title=Wöchentliches Sicherheitsupdate::Trivy hat Befunde (oder konnte nicht prüfen) – es wird nichts veröffentlicht."
          fi
          exit "$rc"

      - name: guacd prüfen (Trivy, nur Hinweis)
        if: steps.diff.outputs.changed == 'true'
        env:
          PK_TRIVY_REPORT: trivy-guacd.md
        run: |
          # guacd baut das Guacamole-Projekt – POCKET KNIFE nimmt immer dessen neueste Version, kann es aber nicht selbst
          # korrigieren; Befunde blockieren das Update deshalb nicht, sie stehen in der Zusammenfassung
          G=$(sed -n 's/^\(guacamole\/guacd:[^ ]*\)$/\1/p' docker/guacd.txt | head -n 1)
          rc=0; sh tools/trivy-scan.sh "$G" || rc=$?
          if [ -f trivy-guacd.md ]; then cat trivy-guacd.md >> "$GITHUB_STEP_SUMMARY"; fi
          [ "$rc" = 0 ] || echo "::warning title=guacd::$G hat Befunde (oder ließ sich nicht prüfen) – Korrektur nur durch das Guacamole-Projekt."

      - name: Neue Version eintragen und auf main speichern
        id: ver
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(python3 tools/security-release.py "$RUNNER_TEMP/vorher")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          git add -A Dockerfile requirements.lock requirements.caps build-requirements.txt docker/apt-build.txt docker/apt-runtime.txt \
            docker/guacd.txt VERSION CHANGELOG.md app/news.json README.md README.en.md
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "pocketknife $VER: wöchentliches Sicherheitsupdate (Basis-Image und Pakete)"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${{ github.event.repository.default_branch }}"
          echo "Neue Version **$VER** auf ${{ github.event.repository.default_branch }} gespeichert – Release wird gestartet." >> "$GITHUB_STEP_SUMMARY"

      - name: Release starten
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

  unterbau:
    # Eigener Job: meldet rechtzeitig, wann Python-Reihe oder Debian-Version keine Updates mehr bekommen (rot ab 180
    # Tagen vorher → Mail) – blockiert die Sicherheitsupdates nie
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Wie lange gibt es noch Updates für den Unterbau?
        run: |
          rc=0; python3 tools/unterbau-check.py > unterbau.txt || rc=$?
          cat unterbau.txt
          sed 's/^::[a-z]* title=[^:]*:://' unterbau.txt >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
