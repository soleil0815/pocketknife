# POCKET KNIFE – täglicher Sicherheits-Scan des veröffentlichten Images (ghcr.io/…/pocketknife:latest) mit Trivy.
# Neue Schwachstellen werden auch NACH einem Release bekannt – dieser Lauf meldet sie (fehlgeschlagener Lauf → GitHub
# schickt eine Mail an den Besitzer). Abhilfe: Actions → Versionen aktualisieren → Run workflow, danach ein Release.
# Hinweis: GitHub pausiert geplante Läufe nach 60 Tagen ohne Änderung im Repository (dann unter Actions wieder aktivieren).
name: Sicherheits-Scan

on:
  schedule:
    - cron: "17 5 * * *"   # täglich 05:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read      # privates Image aus ghcr.io lesen
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Anmelden an ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Schwachstellen prüfen (Trivy)
        env:
          PK_TRIVY_REPORT: trivy.md
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY,,}:latest"
          rc=0; sh tools/trivy-scan.sh "$IMG" || rc=$?
          if [ -f trivy.md ]; then cat trivy.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ "$rc" = 1 ]; then
            echo "::error title=Sicherheits-Scan::Im veröffentlichten Image gibt es Schwachstellen mit verfügbarer Korrektur. Abhilfe: Actions → Versionen aktualisieren → Run workflow, danach ein neues Release."
          fi
          exit "$rc"
